<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Admin Guia · Micael Tatuagem</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0a;
      --surface: #111010;
      --deep:    #181616;
      --bone:    #d4c9b0;
      --blood:   #8b1a1a;
      --muted:   #6b6560;
      --border:  rgba(212,201,176,0.12);
      --success: #4ade80;
      --gold:    #c9a84c;
      --radius:  4px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--bone); font-family: 'Inter', sans-serif; min-height: 100vh; }

    #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 3rem 2rem; width: 100%; max-width: 380px; text-align: center; }
    .login-title { font-family: 'Cinzel', serif; font-size: 1.1rem; color: var(--gold); letter-spacing: .1em; margin-bottom: .3rem; }
    .login-sub { font-size: .72rem; color: var(--muted); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 2rem; }
    .login-group { margin-bottom: 1.2rem; text-align: left; }
    .login-group label { display: block; font-size: .7rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .login-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--bone); font-size: .9rem; padding: 10px 14px; outline: none; }
    .login-group input:focus { border-color: var(--gold); }
    .btn-login { width: 100%; padding: 12px; background: var(--blood); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-family: 'Cinzel', serif; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; margin-top: .5rem; }
    .btn-login:hover { background: #a31f1f; }
    .login-err { color: #e07070; font-size: .8rem; margin-top: 10px; min-height: 1.2em; }

    #adminPanel { display: none; max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 1rem; }
    .admin-header h1 { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--gold); letter-spacing: .1em; }
    .admin-header-links { display: flex; gap: 1.5rem; font-size: .82rem; }
    .admin-header-links a { color: var(--muted); text-decoration: none; }
    .admin-header-links a:hover { color: var(--bone); }

    .toolbar { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
    .toolbar-filters { display:flex; gap:.5rem; flex-wrap:wrap; }
    .filter-btn { font-size:.75rem; padding:.45rem .9rem; border-radius:999px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; }
    .filter-btn.active { background: var(--gold); color:#0a0a0a; border-color: var(--gold); }
    .btn-novo { padding:.6rem 1.2rem; background: var(--blood); color:#fff; border:none; border-radius:var(--radius); cursor:pointer; font-size:.82rem; }
    .btn-novo:hover { background:#a31f1f; }

    .entry-list { display:flex; flex-direction:column; gap:.6rem; }
    .entry-row { display:flex; align-items:center; gap:1rem; padding:.9rem 1rem; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; }
    .entry-row:hover { border-color: var(--gold); }
    .entry-cat { font-size:.65rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); min-width:90px; }
    .entry-titulo { flex:1; font-size:.92rem; }
    .draft-badge { font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; background: var(--blood); color:#fff; padding:.2rem .5rem; border-radius:3px; }
    .entry-slug { font-size:.72rem; color:var(--muted); }

    /* modal / formulário */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; padding:1.5rem; }
    .modal.open { display:flex; }
    .modal-card { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); max-width:640px; width:100%; max-height:88vh; overflow-y:auto; padding:2rem; }
    .modal-card h2 { font-family:'Cinzel', serif; font-size:1rem; color:var(--gold); margin-bottom:1.5rem; }
    .form-group { margin-bottom:1.1rem; }
    .form-group label { display:block; font-size:.72rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
      color:var(--bone); font-size:.88rem; padding:9px 12px; font-family:'Inter',sans-serif;
    }
    .form-group input[type="file"] { padding: 9px 0; border: none; }
    .form-group textarea { min-height:90px; resize:vertical; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .form-hint { font-size:.68rem; color:var(--muted); margin-top:4px; }
    .form-actions { display:flex; gap:.8rem; justify-content:space-between; margin-top:1.5rem; }
    .btn-salvar { padding:.7rem 1.4rem; background:var(--gold); color:#0a0a0a; border:none; border-radius:var(--radius); cursor:pointer; font-weight:500; }
    .btn-salvar:disabled { opacity:.6; cursor:default; }
    .btn-excluir { padding:.7rem 1.2rem; background:transparent; color:#e07070; border:1px solid rgba(224,112,112,.3); border-radius:var(--radius); cursor:pointer; }
    .btn-cancelar { padding:.7rem 1.2rem; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; }
    .draft-toggle { display:flex; align-items:center; gap:.6rem; font-size:.82rem; }
    .preview-imagem { max-width:160px; display:none; margin-top:8px; border-radius:var(--radius); border:1px solid var(--border); }

    .alert { position:fixed; bottom:1.5rem; right:1.5rem; padding:.9rem 1.4rem; border-radius:var(--radius); font-size:.85rem; opacity:0; transform:translateY(10px); transition:.25s; pointer-events:none; z-index:200; }
    .alert.visible { opacity:1; transform:translateY(0); }
    .alert.success { background: rgba(74,222,128,.15); border:1px solid rgba(74,222,128,.4); color: var(--success); }
    .alert.error { background: rgba(224,112,112,.15); border:1px solid rgba(224,112,112,.4); color:#e07070; }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-title">Admin Guia</div>
    <div class="login-sub">Micael Tatuagem</div>
    <form id="loginForm">
      <div class="login-group">
        <label>Senha do admin</label>
        <input type="password" id="inputToken" required autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Entrar</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="adminPanel">
  <div class="admin-header">
    <h1>Guia — Verbetes</h1>
    <div class="admin-header-links">
      <a href="admin-hub">← Painel</a>
      <a href="guia" target="_blank">Ver página pública ↗</a>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-filters" id="filterGroup">
      <button class="filter-btn active" data-cat="todos">Todos</button>
      <button class="filter-btn" data-cat="significado">Significado</button>
      <button class="filter-btn" data-cat="estilo">Estilo</button>
      <button class="filter-btn" data-cat="tecnica">Técnica</button>
      <button class="filter-btn" data-cat="termo">Termo</button>
      <button class="filter-btn" data-cat="draft">Só rascunhos</button>
    </div>
    <button class="btn-novo" id="btnNovo">+ Novo verbete</button>
  </div>

  <div class="entry-list" id="entryList"></div>
</div>

<div class="modal" id="editModal">
  <div class="modal-card">
    <h2 id="modalTitulo">Novo verbete</h2>
    <form id="entryForm">
      <input type="hidden" id="fId">
      <div class="form-row">
        <div class="form-group">
          <label>Termo</label>
          <input type="text" id="fTermo" required>
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="fCategoria">
            <option value="significado">Significado</option>
            <option value="estilo">Estilo</option>
            <option value="tecnica">Técnica</option>
            <option value="termo">Termo</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Slug (URL)</label>
        <input type="text" id="fSlug" required>
        <div class="form-hint">gerado a partir do termo, pode editar</div>
      </div>
      <div class="form-group">
        <label>Tema/tags (separados por vírgula)</label>
        <input type="text" id="fTema" placeholder="ex: significados, floral">
      </div>
      <div class="form-group">
        <label>Descrição (aparece no card e no modal)</label>
        <textarea id="fDescricao" required></textarea>
      </div>
      <div class="form-group">
        <label>Corpo completo (texto estendido, opcional)</label>
        <textarea id="fCorpo" style="min-height:160px"></textarea>
      </div>
      <div class="form-group">
        <label>Imagem</label>
        <input type="file" id="fImagemArquivo" accept="image/*">
        <img id="fImagemPreview" class="preview-imagem">
        <div class="form-hint" id="fImagemAtual"></div>
      </div>
      <div class="form-group">
        <label>Alt text da imagem</label>
        <input type="text" id="fAlt">
      </div>
      <div class="form-group">
        <label>SEO title</label>
        <input type="text" id="fSeoTitle">
      </div>
      <div class="form-group">
        <label>Meta description</label>
        <textarea id="fMetaDesc" style="min-height:60px"></textarea>
      </div>
      <div class="form-group">
        <label>Link do estilo na galeria (se o verbete apontar pra um estilo, ex: /estilo/old-school)</label>
        <input type="text" id="fLinkEstilo">
      </div>
      <div class="form-group">
        <label>Tags relacionadas no catálogo Flash (separadas por vírgula)</label>
        <input type="text" id="fTagsRelacionadas">
        <div class="form-hint">usadas pra puxar peças do flash-data.json relacionadas a esse verbete</div>
      </div>
      <div class="form-group draft-toggle">
        <input type="checkbox" id="fDraft" style="width:auto">
        <label style="margin:0; text-transform:none; letter-spacing:0;">Rascunho (não aparece no site público)</label>
      </div>
      <div class="form-actions">
        <div>
          <button type="button" class="btn-excluir" id="btnExcluir" style="display:none">Excluir</button>
        </div>
        <div style="display:flex; gap:.8rem;">
          <button type="button" class="btn-cancelar" id="btnCancelar">Cancelar</button>
          <button type="submit" class="btn-salvar" id="btnSalvar">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="alert" id="alertBox"></div>

<script>
(function(){
  // mesmas credenciais usadas no resto do site
  const SUPABASE_URL   = 'https://rpgcsejfewltricfsdrd.supabase.co';
  const SUPABASE_KEY   = 'sb_publishable_7LF70sbQS_es_uco138rqw_YfbqnIsa';
  const BUCKET_IMAGENS = 'guia-imagens';

  // senha simples só pra travar o acesso a essa tela (não é autenticação do Supabase)
  const ADMIN_SENHA = 'Sofilhadaputa1';
  const SESSAO_KEY = 'guiaAdminOk';

  let entries = [];
  let currentFilter = 'todos';

  function showAlert(type, msg){
    const el = document.getElementById('alertBox');
    el.textContent = msg;
    el.className = `alert ${type} visible`;
    setTimeout(() => el.className = 'alert', 4000);
  }

  function slugify(str){
    return str.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  }

  function urlImagem(caminho){
    if (!caminho) return '';
    if (/^https?:\/\//i.test(caminho)) return caminho;
    return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_IMAGENS}/${caminho}`;
  }

  // ── LOGIN ──
  document.getElementById('loginForm').addEventListener('submit', handleLogin);

  function handleLogin(e){
    e.preventDefault();
    const senha = document.getElementById('inputToken').value.trim();
    const errEl = document.getElementById('loginErr');
    if (senha !== ADMIN_SENHA) {
      errEl.textContent = '❌ Senha incorreta.';
      return;
    }
    sessionStorage.setItem(SESSAO_KEY, '1');
    errEl.textContent = '';
    showPanel();
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem(SESSAO_KEY) === '1') showPanel();
  });

  async function showPanel(){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    await loadEntries();
    renderList();
  }

  // ── CARGA / SUPABASE ──
  async function loadEntries(){
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/guia_verbetes?select=*&order=termo.asc`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
      });
      entries = resp.ok ? await resp.json() : [];
    } catch {
      entries = [];
    }
  }

  // ── LISTA ──
  function renderList(){
    const list = document.getElementById('entryList');
    const filtered = entries.filter(e => {
      if (currentFilter === 'todos') return true;
      if (currentFilter === 'draft') return e.draft;
      return e.categoria === currentFilter;
    }).sort((a,b) => a.termo.localeCompare(b.termo, 'pt-BR'));

    list.innerHTML = filtered.map(e => `
      <div class="entry-row" data-id="${e.id}">
        <span class="entry-cat">${e.categoria}</span>
        <span class="entry-titulo">${e.termo}</span>
        <span class="entry-slug">${e.slug}</span>
        ${e.draft ? '<span class="draft-badge">RASCUNHO</span>' : ''}
      </div>
    `).join('') || '<p style="color:var(--muted); font-size:.85rem; padding:1rem;">Nenhum verbete nessa categoria.</p>';

    list.querySelectorAll('.entry-row').forEach(row => {
      row.addEventListener('click', () => openEdit(row.dataset.id));
    });
  }

  document.getElementById('filterGroup').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.cat;
    renderList();
  });

  // ── MODAL / FORM ──
  const modal = document.getElementById('editModal');
  document.getElementById('btnNovo').addEventListener('click', () => openEdit(null));
  document.getElementById('btnCancelar').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  function closeModal(){
    modal.classList.remove('open');
    document.getElementById('fImagemArquivo').value = '';
    document.getElementById('fImagemPreview').style.display = 'none';
  }

  function openEdit(id){
    const e = id ? entries.find(x => String(x.id) === String(id)) : null;
    document.getElementById('modalTitulo').textContent = e ? 'Editar verbete' : 'Novo verbete';
    document.getElementById('fId').value = e ? e.id : '';
    document.getElementById('fTermo').value = e ? e.termo : '';
    document.getElementById('fCategoria').value = e ? e.categoria : 'significado';
    document.getElementById('fSlug').value = e ? e.slug : '';
    document.getElementById('fTema').value = e ? (e.tema||[]).join(', ') : '';
    document.getElementById('fDescricao').value = e ? e.descricao : '';
    document.getElementById('fCorpo').value = e ? (e.corpo||'') : '';
    document.getElementById('fAlt').value = e ? (e.imagem_alt||'') : '';
    document.getElementById('fSeoTitle').value = e ? (e.seo_title||'') : '';
    document.getElementById('fMetaDesc').value = e ? (e.meta_description||'') : '';
    document.getElementById('fLinkEstilo').value = e ? (e.link_estilo||'') : '';
    document.getElementById('fTagsRelacionadas').value = e ? (e.tags_relacionadas||[]).join(', ') : '';
    document.getElementById('fDraft').checked = e ? !!e.draft : true;
    document.getElementById('btnExcluir').style.display = e ? 'inline-block' : 'none';

    const preview = document.getElementById('fImagemPreview');
    const atual = document.getElementById('fImagemAtual');
    document.getElementById('fImagemArquivo').value = '';
    if (e && e.imagem_url) {
      preview.src = urlImagem(e.imagem_url);
      preview.style.display = 'block';
      atual.textContent = 'Imagem atual salva. Escolha outro arquivo pra substituir.';
    } else {
      preview.style.display = 'none';
      atual.textContent = '';
    }

    modal.classList.add('open');
  }

  document.getElementById('fTermo').addEventListener('input', function(){
    if (!document.getElementById('fId').value) {
      document.getElementById('fSlug').value = slugify(this.value);
    }
  });

  document.getElementById('fImagemArquivo').addEventListener('change', function(){
    const arquivo = this.files[0];
    const preview = document.getElementById('fImagemPreview');
    if (!arquivo) return;
    preview.src = URL.createObjectURL(arquivo);
    preview.style.display = 'block';
  });

  document.getElementById('btnExcluir').addEventListener('click', async () => {
    const id = document.getElementById('fId').value;
    if (!id) return;
    if (!confirm('Excluir este verbete? Essa ação não pode ser desfeita.')) return;
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/guia_verbetes?id=eq.${id}`, {
        method: 'DELETE',
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
      });
      if (!resp.ok) throw new Error(await resp.text());
      showAlert('success', 'Verbete excluído.');
      closeModal();
      await loadEntries();
      renderList();
    } catch (err) { showAlert('error', 'Falha ao excluir: ' + err.message); }
  });

  async function subirImagem(arquivo, slug){
    const extensao = arquivo.name.split('.').pop();
    const caminho = `${slug}-${Date.now()}.${extensao}`;
    const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET_IMAGENS}/${caminho}`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': arquivo.type
      },
      body: arquivo
    });
    if (!resp.ok) throw new Error('Falha no upload da imagem: ' + await resp.text());
    return caminho;
  }

  document.getElementById('entryForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btnSalvar = document.getElementById('btnSalvar');
    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Salvando...';

    try {
      const id = document.getElementById('fId').value;
      const slug = document.getElementById('fSlug').value.trim();
      const arquivo = document.getElementById('fImagemArquivo').files[0];

      let imagemUrl = id ? (entries.find(x => String(x.id) === String(id))?.imagem_url || null) : null;
      if (arquivo) {
        btnSalvar.textContent = 'Subindo imagem...';
        imagemUrl = await subirImagem(arquivo, slug);
      }

      const data = {
        termo: document.getElementById('fTermo').value.trim(),
        categoria: document.getElementById('fCategoria').value,
        slug: slug,
        tema: document.getElementById('fTema').value.split(',').map(s => s.trim()).filter(Boolean),
        descricao: document.getElementById('fDescricao').value.trim(),
        corpo: document.getElementById('fCorpo').value.trim() || null,
        imagem_url: imagemUrl,
        imagem_alt: document.getElementById('fAlt').value.trim() || null,
        seo_title: document.getElementById('fSeoTitle').value.trim() || null,
        meta_description: document.getElementById('fMetaDesc').value.trim() || null,
        link_estilo: document.getElementById('fLinkEstilo').value.trim() || null,
        tags_relacionadas: document.getElementById('fTagsRelacionadas').value.split(',').map(s => s.trim()).filter(Boolean),
        draft: document.getElementById('fDraft').checked
      };

      btnSalvar.textContent = 'Salvando verbete...';

      let resp;
      if (id) {
        resp = await fetch(`${SUPABASE_URL}/rest/v1/guia_verbetes?id=eq.${id}`, {
          method: 'PATCH',
          headers: {
            apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json', Prefer: 'return=minimal'
          },
          body: JSON.stringify(data)
        });
      } else {
        resp = await fetch(`${SUPABASE_URL}/rest/v1/guia_verbetes`, {
          method: 'POST',
          headers: {
            apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json', Prefer: 'return=minimal'
          },
          body: JSON.stringify(data)
        });
      }

      if (!resp.ok) throw new Error(await resp.text());

      showAlert('success', 'Verbete salvo.');
      closeModal();
      await loadEntries();
      renderList();
    } catch (err) {
      showAlert('error', 'Falha ao salvar: ' + err.message);
    } finally {
      btnSalvar.disabled = false;
      btnSalvar.textContent = 'Salvar';
    }
  });
})();
</script>
</body>
</html>
