<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Admin Anamnese · Micael Tatuagem</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --surface:   #111111;
      --surface2:  #181818;
      --border:    #242424;
      --accent:    #8b1a1a;
      --gold:      #c9a84c;
      --gold-dim:  #7a6128;
      --text:      #e0e0e0;
      --muted:     #666;
      --green:     #1e6b3a;
      --green-t:   #0d2e1a;
      --radius:    4px;
    }

    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; }

    /* ── LOGIN ── */
    #loginScreen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      width: 100%; max-width: 360px;
      text-align: center;
    }

    .login-logo {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      color: var(--gold);
      letter-spacing: .14em;
      margin-bottom: 4px;
    }

    .login-sub { font-size: .72rem; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; margin-bottom: 32px; }

    .login-box label {
      display: block; font-size: .68rem; color: var(--muted);
      letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px;
    }

    .login-field { margin-bottom: 16px; text-align: left; }

    .login-hint { font-size: .72rem; color: var(--muted); margin-top: 5px; line-height: 1.4; }

    .login-box input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: .9rem;
      padding: 11px 14px; outline: none; transition: border-color .2s;
    }

    .login-box input[type="password"]:focus { border-color: var(--gold); }

    .btn {
      display: inline-block; padding: 10px 20px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); cursor: pointer;
      font-family: 'Cinzel', serif; font-size: .78rem;
      letter-spacing: .1em; text-transform: uppercase;
      transition: background .2s;
    }
    .btn:hover { background: #a31f1f; }
    .btn-sm { padding: 6px 12px; font-size: .7rem; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); font-family: 'Inter', sans-serif;
      font-size: .75rem; letter-spacing: .04em; text-transform: none;
    }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); background: transparent; }
    .btn-danger { background: #5a1010; }
    .btn-danger:hover { background: #7a1515; }
    .btn-success { background: var(--green); }
    .btn-success:hover { background: #246b42; }

    .login-err { color: #e07070; font-size: .8rem; margin-top: 10px; display: none; }

    /* ── ADMIN SHELL ── */
    #adminShell { display: none; min-height: 100vh; }

    /* header */
    .adm-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 20px;
      position: sticky; top: 0; z-index: 100;
    }

    .adm-logo { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold); letter-spacing: .1em; flex: 1; }
    .adm-logo span { color: var(--muted); font-size: .7rem; letter-spacing: .14em; display: block; }

    .adm-nav a {
      font-size: .75rem; color: var(--muted); text-decoration: none;
      padding: 4px 10px; border-radius: var(--radius);
      transition: color .15s;
    }
    .adm-nav a:hover { color: var(--gold); }

    /* main content */
    .adm-body { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

    /* toolbar */
    .toolbar {
      display: flex; gap: 12px; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap;
    }

    .search-wrap { position: relative; flex: 1; min-width: 220px; }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: .85rem;
      padding: 9px 12px 9px 34px;
      outline: none;
      transition: border-color .2s;
    }

    .search-wrap input:focus { border-color: var(--gold); }

    .search-wrap::before {
      content: '⌕';
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: 1rem; pointer-events: none;
    }

    .filter-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: .82rem;
      padding: 9px 12px;
      outline: none;
      cursor: pointer;
    }

    .count-badge {
      font-size: .72rem; color: var(--muted);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 3px 10px;
      white-space: nowrap;
    }

    /* table */
    .table-wrap { overflow-x: auto; }

    table.list {
      width: 100%; border-collapse: collapse;
    }

    table.list th {
      background: var(--surface2);
      color: var(--gold);
      font-family: 'Cinzel', serif;
      font-size: .65rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    table.list th:hover { color: #e0c060; }

    table.list td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: .82rem;
    }

    table.list tr:hover td { background: var(--surface2); }

    .td-name { font-weight: 500; color: var(--text); }
    .td-doc { color: var(--muted); font-size: .78rem; }
    .td-date { white-space: nowrap; color: var(--muted); }

    .badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 20px; font-size: .68rem;
      letter-spacing: .06em; text-transform: uppercase;
    }

    .badge-sim { background: #0d2e1a; color: #5dbb7e; border: 1px solid #1e6b3a; }
    .badge-nao { background: #1a1a1a; color: var(--muted); border: 1px solid var(--border); }
    .badge-foto { background: #1a1200; color: #c9a84c; border: 1px solid var(--gold-dim); }

    /* ── MODAL ── */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 200;
      overflow-y: auto;
      padding: 40px 16px;
    }

    .modal-bg.open { display: block; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 840px;
      margin: 0 auto;
      padding: 32px;
    }

    .modal-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 28px;
    }

    .modal-name {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--gold);
    }

    .modal-close {
      background: none; border: none; color: var(--muted);
      font-size: 1.4rem; cursor: pointer; padding: 0 4px;
      transition: color .2s;
    }

    .modal-close:hover { color: var(--text); }

    .modal-section {
      margin-bottom: 24px;
    }

    .modal-section-title {
      font-family: 'Cinzel', serif;
      font-size: .68rem;
      letter-spacing: .16em;
      color: var(--gold);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      padding-bottom: 7px;
      margin-bottom: 14px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .info-item label {
      display: block; font-size: .68rem; color: var(--muted);
      letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px;
    }

    .info-item span { font-size: .85rem; }

    /* anamnese summary */
    .anamnese-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }

    .anamnese-row {
      display: flex; gap: 8px; align-items: flex-start;
      font-size: .8rem; padding: 5px 8px;
      background: var(--surface2); border-radius: var(--radius);
    }

    .anamnese-row .cond { flex: 1; color: #aaa; }
    .anamnese-row .detail { color: var(--muted); font-size: .72rem; }

    /* ── HISTÓRICO DE TATUAGENS ── */
    .tatoo-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

    .tatoo-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex; align-items: center; gap: 16px;
    }

    .tatoo-date { font-size: .72rem; color: var(--muted); white-space: nowrap; min-width: 80px; }
    .tatoo-desc { flex: 1; font-size: .85rem; }
    .tatoo-value { font-size: .85rem; color: var(--gold); white-space: nowrap; }
    .tatoo-del { background: none; border: none; color: #5a1010; cursor: pointer; font-size: 1rem; padding: 0 4px; transition: color .15s; }
    .tatoo-del:hover { color: #c0392b; }

    .add-tatoo-form {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      grid-template-columns: 120px 1fr 120px auto;
      gap: 10px;
      align-items: end;
    }

    .add-tatoo-form label {
      display: block; font-size: .68rem; color: var(--muted);
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px;
    }

    .add-tatoo-form input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: .82rem;
      padding: 8px 10px;
      outline: none;
    }

    .add-tatoo-form input:focus { border-color: var(--gold); }

    /* ── VÍNCULO COM PROMOÇÃO ── */
    .link-promo-form {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .link-promo-form label {
      display: block; font-size: .68rem; color: var(--muted);
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px;
    }

    .link-promo-form input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: .82rem;
      padding: 8px 10px;
      outline: none;
      text-transform: uppercase;
    }

    .link-promo-form input:focus { border-color: var(--gold); }

    .link-promo-status {
      font-size: .78rem; color: var(--muted); margin-bottom: 10px;
    }

    .link-promo-status strong { color: var(--gold); }

    /* termo viewer */
    .termo-viewer {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: .78rem;
      color: #999;
      line-height: 1.75;
      max-height: 200px;
      overflow-y: auto;
    }

    /* print */
    @media print {
      #loginScreen, .adm-header, .toolbar, .btn, .tatoo-del { display: none !important; }
      .modal-bg { position: static; background: white; padding: 0; }
      .modal { border: none; }
    }

    /* empty state */
    .empty {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: .9rem;
    }

    .empty .ico { font-size: 2.5rem; margin-bottom: 12px; }

    /* loading */
    .loading { text-align: center; padding: 40px; color: var(--muted); }

    /* snackbar */
    #snack {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 10px 20px; border-radius: 24px;
      font-size: .8rem; z-index: 999; display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
    }

    @media (max-width: 600px) {
      .add-tatoo-form { grid-template-columns: 1fr 1fr; }
      .anamnese-summary { grid-template-columns: 1fr; }
      .info-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Micael Tatuagem</div>
    <div class="login-sub">Painel · Anamnese</div>

    <div class="login-alert" id="loginAlert" style="display:none;padding:10px 14px;border-radius:4px;margin-bottom:16px;font-size:.82rem;"></div>

    <form onsubmit="tryLogin(event)">
      <div class="login-field">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com" required autofocus />
      </div>
      <div class="login-field">
        <label for="loginPass">Senha</label>
        <input type="password" id="loginPass" placeholder="Digite sua senha" required />
      </div>
      <button type="submit" class="btn" style="width:100%;margin-top:4px">Acessar</button>
    </form>
  </div>
</div>

<!-- ADMIN -->
<div id="adminShell">

  <header class="adm-header">
    <div class="adm-logo">
      Micael Tatuagem
      <span>Painel · Anamnese</span>
    </div>
    <nav class="adm-nav">
      <a href="admin-hub">← Hub</a>
      <a href="./" target="_blank">Site</a>
    </nav>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
  </header>

  <div class="adm-body">

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="Buscar por nome, CPF, RG ou data (AAAA-MM-DD)…" oninput="applyFilter()" />
      </div>
      <select class="filter-select" id="filterFoto" onchange="applyFilter()">
        <option value="">Todas as fichas</option>
        <option value="sim">Autoriza foto</option>
        <option value="nao">Não autoriza foto</option>
      </select>
      <span class="count-badge" id="countBadge">— fichas</span>
      <button class="btn btn-sm" onclick="loadAll()">↻ Atualizar</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap" id="tableWrap">
      <div class="loading">Carregando…</div>
    </div>

  </div>
</div>

<!-- MODAL FICHA -->
<div class="modal-bg" id="modalBg" onclick="closeModalBg(event)">
  <div class="modal" id="modalContent">
    <div class="modal-header">
      <div class="modal-name" id="mNome">—</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<!-- SNACK -->
<div id="snack"></div>

<script>
// ─────────────────────────────────────
// CONFIG
// ─────────────────────────────────────
const SUPA_URL   = 'https://rpgcsejfewltricfsdrd.supabase.co';
const SUPA_KEY   = 'sb_publishable_7LF70sbQS_es_uco138rqw_YfbqnIsa';

const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

// Escapa qualquer texto antes de jogar em innerHTML — evita que um nome/CPF/etc.
// digitado no formulário público (anamnese.html) vire código executável aqui.
function escapeHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─────────────────────────────────────
// AUTH — login real via Supabase Auth
// ─────────────────────────────────────
async function tryLogin(e) {
  e.preventDefault();
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const alertEl  = document.getElementById('loginAlert');

  const showErr = (msg) => {
    alertEl.textContent = msg;
    alertEl.style.cssText = 'display:block;background:#2e0d0d;border:1px solid #8b1a1a;color:#e07070;padding:10px 14px;border-radius:4px;margin-bottom:16px;font-size:.82rem;';
    setTimeout(() => { alertEl.style.display = 'none'; }, 4000);
  };

  alertEl.textContent = '⏳ Entrando...';
  alertEl.style.cssText = 'display:block;background:#111;border:1px solid #333;color:#aaa;padding:10px 14px;border-radius:4px;margin-bottom:16px;font-size:.82rem;';

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  if (error) {
    showErr('❌ ' + (error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message));
    return;
  }

  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminShell').style.display = 'block';
  document.getElementById('loginPass').value = '';
  loadAll();
}

async function logout() {
  if (confirm('Deseja realmente sair?')) {
    await db.auth.signOut();
    location.reload();
  }
}

// ao carregar a página, verifica se já existe uma sessão válida
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminShell').style.display = 'block';
    loadAll();
  }
})();

// ─────────────────────────────────────
// SUPABASE — dados
// ─────────────────────────────────────
let allRecords = [];
let sortCol = 'criado_em';
let sortAsc = false;

async function loadAll() {
  document.getElementById('tableWrap').innerHTML = '<div class="loading">Carregando…</div>';
  const { data, error } = await db
    .from('anamneses')
    .select('*')
    .order('criado_em', { ascending: false });

  if (error) {
    document.getElementById('tableWrap').innerHTML = `<div class="loading" style="color:#e07070">Erro: ${error.message}</div>`;
    return;
  }

  allRecords = data || [];
  applyFilter();
}

function applyFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const foto = document.getElementById('filterFoto').value;

  let list = allRecords.filter(r => {
    const matchSearch = !q ||
      (r.nome || '').toLowerCase().includes(q) ||
      (r.cpf  || '').replace(/\D/g,'').includes(q.replace(/\D/g,'')) ||
      (r.rg   || '').replace(/\D/g,'').includes(q.replace(/\D/g,'')) ||
      (r.criado_em || '').includes(q);

    const matchFoto = !foto ||
      (foto === 'sim' && r.autoriza_foto === true) ||
      (foto === 'nao' && r.autoriza_foto !== true);

    return matchSearch && matchFoto;
  });

  // sort
  list.sort((a, b) => {
    let va = a[sortCol] || '';
    let vb = b[sortCol] || '';
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ?  1 : -1;
    return 0;
  });

  document.getElementById('countBadge').textContent = `${list.length} ficha${list.length !== 1 ? 's' : ''}`;
  renderTable(list);
}

function setSort(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  applyFilter();
}

function renderTable(list) {
  if (!list.length) {
    document.getElementById('tableWrap').innerHTML =
      '<div class="empty"><div class="ico">📋</div>Nenhuma ficha encontrada.</div>';
    return;
  }

  const rows = list.map(r => {
    const data = r.criado_em ? new Date(r.criado_em).toLocaleDateString('pt-BR') : '—';
    const foto = r.autoriza_foto
      ? '<span class="badge badge-foto">Sim</span>'
      : '<span class="badge badge-nao">Não</span>';
    const tatuagens = (r.tatuagens || []).length;

    return `
      <tr style="cursor:pointer" onclick="openModal('${r.id}')">
        <td class="td-name">${escapeHtml(r.nome) || '—'}</td>
        <td class="td-doc">${escapeHtml(r.cpf) || '—'}</td>
        <td class="td-doc">${escapeHtml(r.rg)  || '—'}</td>
        <td>${escapeHtml(r.celular) || '—'}</td>
        <td class="td-date">${data}</td>
        <td>${foto}</td>
        <td style="text-align:center;color:var(--muted)">${tatuagens}</td>
        <td onclick="event.stopPropagation()">
          <button class="btn btn-ghost btn-sm" onclick="openModal('${r.id}')">Ver</button>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table class="list">
      <thead>
        <tr>
          <th onclick="setSort('nome')">Nome ↕</th>
          <th onclick="setSort('cpf')">CPF ↕</th>
          <th onclick="setSort('rg')">RG ↕</th>
          <th>Celular</th>
          <th onclick="setSort('criado_em')">Cadastro ↕</th>
          <th>Foto</th>
          <th>Tatuagens</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ─────────────────────────────────────
// MODAL
// ─────────────────────────────────────
let currentId = null;

async function openModal(id) {
  currentId = id;
  const rec = allRecords.find(r => r.id === id);
  if (!rec) return;

  document.getElementById('mNome').textContent = rec.nome || '—';
  document.getElementById('mBody').innerHTML = buildModalHTML(rec);
  document.getElementById('modalBg').classList.add('open');

  // init tatoo form
  document.getElementById('btnAddTatoo').addEventListener('click', () => addTatoo(id));
}

function buildModalHTML(rec) {

        <div class="info-item"><label>E-mail</label><span>${escapeHtml(rec.email) || '—'}</span></div>
        <div class="info-item"><label>Profissão</label><span>${escapeHtml(rec.profissao) || '—'}</span></div>

        <div class="info-item"><label>Emergência</label><span>${escapeHtml(rec.emergencia_nome) || '—'}</span></div>

    <!-- VÍNCULO COM PROMOÇÃO -->

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  currentId = null;
}

function closeModalBg(e) {
  if (e.target === document.getElementById('modalBg')) closeModal();
}

// ─────────────────────────────────────
// VÍNCULO COM PROMOÇÃO
// ─────────────────────────────────────
// Só existe pra corrigir manualmente o caso em que a cliente preencheu a
// anamnese sem vir do link com ?cod= (ex: preencheu antes de se cadastrar
// na promoção, ou o link foi aberto errado). O vínculo automático continua
// sendo feito por anamnese.html via URLSearchParams — isso aqui é só o
// reparo manual pelo admin.
async function salvarCodigoIndicacao(id) {
  const input = document.getElementById('codigoIndicacaoInput');
  const codigo = input.value.trim().toUpperCase() || null;

  const { error } = await db
    .from('anamneses')
    .update({ codigo_indicacao: codigo })
    .eq('id', id);

  if (error) { snack('Erro: ' + error.message); return; }

  const rec = allRecords.find(r => r.id === id);
  if (rec) rec.codigo_indicacao = codigo;

  snack(codigo ? `Vinculada ao código ${codigo}.` : 'Vínculo removido.');
  openModal(id); // re-render pra atualizar o "Código atual" e o botão de tatuagem
}

// ─────────────────────────────────────
// HISTÓRICO TATUAGENS
// ─────────────────────────────────────
async function addTatoo(id) {
  const data    = document.getElementById('newTatooData').value;
  const desc    = document.getElementById('newTatooDesc').value.trim();
  const valor   = parseFloat(document.getElementById('newTatooValor').value) || null;

  if (!desc) { snack('Preencha a descrição da tatuagem.'); return; }

  const rec = allRecords.find(r => r.id === id);
  if (!rec) return;

  const novaTatoo = { data: data || null, descricao: desc, valor };
  const lista = [...(rec.tatuagens || []), novaTatoo];

  const { error } = await db
    .from('anamneses')
    .update({ tatuagens: lista })
    .eq('id', id);

  if (error) { snack('Erro: ' + error.message); return; }

  rec.tatuagens = lista;
  document.getElementById('newTatooData').value = '';
  document.getElementById('newTatooDesc').value = '';
  document.getElementById('newTatooValor').value = '';

  // refresh tatoo list
  const container = document.getElementById(`tatooList-${id}`);
  container.innerHTML = lista.map((t, i) => `
    <div class="tatoo-card">
      <span class="tatoo-date">${escapeHtml(t.data) || '—'}</span>
      <span class="tatoo-desc">${escapeHtml(t.descricao) || '—'}</span>
      <span class="tatoo-value">${t.valor ? 'R$ ' + parseFloat(t.valor).toLocaleString('pt-BR', {minimumFractionDigits:2}) : '—'}</span>
      <button class="tatoo-del" title="Remover" onclick="removeTatoo('${id}', ${i})">✕</button>
    </div>`).join('');

  // re-attach listener
  document.getElementById('btnAddTatoo').addEventListener('click', () => addTatoo(id));
  snack('Tatuagem adicionada.');
}

async function removeTatoo(id, index) {
  if (!confirm('Remover este registro?')) return;

  const rec = allRecords.find(r => r.id === id);
  if (!rec) return;

  const lista = (rec.tatuagens || []).filter((_, i) => i !== index);

  const { error } = await db
    .from('anamneses')
    .update({ tatuagens: lista })
    .eq('id', id);

  if (error) { snack('Erro: ' + error.message); return; }

  rec.tatuagens = lista;
  const container = document.getElementById(`tatooList-${id}`);
  container.innerHTML = lista.length
    ? lista.map((t, i) => `
        <div class="tatoo-card">
          <span class="tatoo-date">${escapeHtml(t.data) || '—'}</span>
          <span class="tatoo-desc">${escapeHtml(t.descricao) || '—'}</span>
          <span class="tatoo-value">${t.valor ? 'R$ ' + parseFloat(t.valor).toLocaleString('pt-BR', {minimumFractionDigits:2}) : '—'}</span>
          <button class="tatoo-del" title="Remover" onclick="removeTatoo('${id}', ${i})">✕</button>
        </div>`).join('')
    : '<p style="color:var(--muted);font-size:.8rem;padding:8px 0">Nenhuma tatuagem registrada ainda.</p>';

  snack('Registro removido.');
}

function formatarWppNum(fone) {
  const d = fone.replace(/\D/g, '');
  return d.startsWith('55') ? d : '55' + d;
}

Quaisquer retoques de tatuagens, não descritos no item acima, serão realizados apenas mediante pagamento do VALOR MÍNIMO DE SERVIÇOS DE TATUAGEM, conforme tabela em vigor na data em que o serviço for solicitado.

Tatuagens que tenham sido negociadas pelo valor total do serviço, e que necessitem de mais de uma sessão para serem finalizadas, têm o prazo máximo de 60 dias corridos entre sessões para o melhor andamento do serviço. Caso o cliente extrapole esse prazo, por motivos alheios ao profissional, o valor da tatuagem será renegociado, de acordo com os valores por sessão conforme tabela em vigor na data em que o serviço for solicitado.

Para garantir o correto resultado na aplicação de uma tatuagem, existem padronizações técnicas e estéticas que devem ser seguidas, como o tamanho ideal do desenho em relação ao local do corpo e restrição das cores em relação ao tom da pele.

Caso, mesmo após ser informado disto, continue optando, insistindo e exigindo um desenho em uma escala que com certeza irá influenciar negativamente o resultado esperado, a responsabilidade deste fato é única e exclusiva do cliente.

Pessoas com compulsão por bronzeamento, ou que, mesmo devidamente avisadas do resguardo necessário no período de cicatrização, optam por ficarem expostas ao Sol, tomar banho de piscina e/ou mar, abusarem do uso de álcool e/ou drogas, ficam totalmente responsáveis pelo resultado, positivo ou negativo, eventuais inflamações, infecções, baixa absorção de pigmento ou qualquer outro dano em um procedimento realizado em um ambiente estéril, que segue todas as regras de biossegurança.

Neste caso o profissional fica livre de qualquer responsabilidade em relação ao resultado, podendo cobrar por um novo procedimento para corrigir o dano causado pela negligência do cliente, ou até mesmo optar por não realizar o serviço.

_Este documento confirma a ciência e aceite integral das cláusulas acima. Guarde esta mensagem como comprovante._`;

  const msg = termo + '\n\n──────────────────────\n\n' + CUIDADOS_WPP;
  const num = formatarWppNum(rec.celular);
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

// ─────────────────────────────────────
// DELETE FICHA
// ─────────────────────────────────────
async function deleteRecord(id) {
  if (!confirm('Excluir esta ficha permanentemente? Esta ação não pode ser desfeita.')) return;

  const { error } = await db.from('anamneses').delete().eq('id', id);
  if (error) { snack('Erro: ' + error.message); return; }

  allRecords = allRecords.filter(r => r.id !== id);
  closeModal();
  applyFilter();
  snack('Ficha excluída.');
}

// ─────────────────────────────────────
// SNACKBAR
// ─────────────────────────────────────
let snackTimer;
function snack(msg) {
  const el = document.getElementById('snack');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}
