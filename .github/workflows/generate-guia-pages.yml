name: Gerar páginas do Guia

# Disparada de 3 formas:
# 1. repository_dispatch (tipo "guia-updated") — chamada automaticamente pelo
#    Database Webhook do Supabase toda vez que a tabela guia_verbetes muda.
# 2. workflow_dispatch — botão manual "Run workflow" na aba Actions do GitHub,
#    pra rodar na mão quando quiser.
# 3. schedule — roda 1x por dia de madrugada como rede de segurança, caso o
#    webhook do Supabase falhe ou fique fora do ar por algum motivo.
on:
  repository_dispatch:
    types: [guia-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # 03:00 horário de Brasília (06:00 UTC)

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gerar páginas do Guia
        run: node scripts/generate-guia-pages.js

      - name: Commitar páginas geradas (se houver mudança)
        run: |
          git config user.name "guia-bot"
          git config user.email "guia-bot@users.noreply.github.com"
          git add guia/ sitemap.xml guia.html
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos verbetes, nada pra commitar."
          else
            git commit -m "Atualiza páginas do Guia [automático]"
            git push
          fi
