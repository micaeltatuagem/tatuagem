name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 9 * * 0,3'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (heartbeat table)
        run: |
          curl -sf -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&order=id.desc&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Insert new heartbeat row
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}'
