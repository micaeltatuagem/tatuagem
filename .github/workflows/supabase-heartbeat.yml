name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 9 * * 0,3'   # domingo e quarta, 9h UTC
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para o commit anti-hibernação
  issues: write      # necessário para abrir Issue em caso de falha

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ping Supabase (heartbeat table)
        id: read
        run: |
          curl -sf -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&order=id.desc&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      - name: Insert new heartbeat row
        id: insert
        run: |
          curl -sf -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}'

      - name: Delete heartbeat rows older than 7 days
        id: cleanup
        run: |
          CUTOFF=$(date -u -d '7 days ago' +"%Y-%m-%dT%H:%M:%SZ")
          curl -sf -X DELETE "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?created_at=lt.${CUTOFF}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Prefer: return=minimal"
        # Nota: DELETE via anon/publishable key normalmente é bloqueado por RLS (o que é bom!).
        # Por isso essa etapa usa a secret key (antiga service_role), que ignora RLS.

      - name: Update last-run marker (keeps repo active)
        run: |
          mkdir -p .heartbeat
          echo "Last successful run: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" > .heartbeat/last-run.txt
          git config user.name "heartbeat-bot"
          git config user.email "actions@github.com"
          git add .heartbeat/last-run.txt
          git diff --staged --quiet || git commit -m "chore: heartbeat run $(date -u +%Y-%m-%d)"
          git push

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Supabase Heartbeat falhou em ${new Date().toISOString().slice(0,10)}`,
              body: [
                'O workflow **Supabase Heartbeat** falhou.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Possíveis causas:',
                '- Chave da API (anon/publishable ou service_role/secret) expirada ou revogada',
                '- RLS bloqueando SELECT/INSERT/DELETE',
                '- Projeto Supabase já pausado (verifique o dashboard)',
                '- URL do projeto incorreta'
              ].join('\n'),
              labels: ['bug', 'heartbeat']
            });
