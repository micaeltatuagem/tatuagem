<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Admin Galeria · Micael Tatuagem</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0a0a;
      --surface: #111010;
      --deep:    #181616;
      --bone:    #d4c9b0;
      --blood:   #8b1a1a;
      --muted:   #6b6560;
      --border:  rgba(212,201,176,0.12);
      --success: #4ade80;
      --radius:  4px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--bone); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* LOGIN */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 2rem;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 3rem 2rem;
      width: 100%; max-width: 380px; text-align: center;
    }
    .login-title { font-family: 'Cinzel', serif; font-size: 1.1rem; color: #c9a84c; letter-spacing: .1em; margin-bottom: .3rem; }
    .login-sub { font-size: .72rem; color: var(--muted); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 2rem; }
    .login-group { margin-bottom: 1.2rem; text-align: left; }
    .login-group label { display: block; font-size: .7rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .login-group input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--bone); font-size: .9rem; padding: 10px 14px; outline: none; transition: border-color .2s; }
    .login-group input:focus { border-color: #c9a84c; }
    .login-hint { font-size: .7rem; color: var(--muted); margin-top: 5px; }
    .btn-login { width: 100%; padding: 12px; background: var(--blood); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-family: 'Cinzel', serif; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; margin-top: .5rem; transition: background .2s; }
    .btn-login:hover { background: #a31f1f; }
    .login-err { color: #e07070; font-size: .8rem; margin-top: 10px; min-height: 1.2em; }

    /* PAINEL */
    #adminPanel { display: none; max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 1rem; }
    .admin-header h1 { font-family: 'Cinzel', serif; font-size: 1.2rem; color: #c9a84c; letter-spacing: .1em; }
    .admin-header-links { display: flex; gap: 1.5rem; font-size: .82rem; }
    .admin-header-links a { color: var(--muted); text-decoration: none; cursor: pointer; transition: color .2s; }
    .admin-header-links a:hover { color: var(--bone); }

    /* STATUS */
    .github-status { display: flex; align-items: center; gap: .6rem; font-size: .78rem; padding: .6rem 1rem; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 1.5rem; }
    .github-status.connected { border-color: rgba(74,222,128,.3); color: var(--success); }
    .github-status.disconnected { border-color: rgba(139,26,26,.3); color: #e05555; }

    /* STATS */
    .stats-bar { display: flex; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .stat-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem 1.5rem; text-align: center; }
    .stat-number { font-size: 1.8rem; font-weight: 300; color: #c9a84c; }
    .stat-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

    /* FORM */
    .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
    .form-section h2 { font-family: 'Cinzel', serif; font-size: .95rem; color: #c9a84c; letter-spacing: .08em; margin-bottom: 1.2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--bone); font-size: .88rem; padding: 9px 12px; outline: none; font-family: 'Inter', sans-serif; transition: border-color .2s; }
    .form-group input:focus, .form-group textarea:focus { border-color: #c9a84c; }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .tags-container { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .3rem; }
    .tag-option { display: flex; align-items: center; gap: .4rem; background: var(--deep); border: 1px solid var(--border); border-radius: 20px; padding: .3rem .8rem; cursor: pointer; font-size: .8rem; }
    .tag-option input { width: auto; accent-color: var(--blood); }

    /* PREVIEW */
    .preview-box { border: 1px dashed var(--border); border-radius: var(--radius); min-height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); }
    .preview-box img { max-width: 100%; max-height: 240px; object-fit: contain; display: none; }
    .preview-placeholder { color: var(--muted); font-size: .82rem; }

    /* UPLOAD PROGRESS */
    .upload-progress { display: none; margin-top: .8rem; }
    .upload-progress.visible { display: block; }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--blood); width: 0%; transition: width .3s; }
    .progress-text { font-size: .75rem; color: var(--muted); margin-top: .4rem; }

    /* BUTTONS */
    .btn { padding: .6rem 1.2rem; border: none; border-radius: var(--radius); cursor: pointer; font-size: .82rem; font-family: 'Inter', sans-serif; transition: background .2s; }
    .btn-primary { background: var(--blood); color: #fff; }
    .btn-primary:hover { background: #a31f1f; }
    .btn-secondary { background: var(--deep); color: var(--bone); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--bone); }
    .btn-danger { background: rgba(139,26,26,.2); color: #e05555; border: 1px solid rgba(139,26,26,.3); }
    .btn-danger:hover { background: rgba(139,26,26,.4); }

    /* ALERT */
    .alert { padding: .8rem 1rem; border-radius: var(--radius); font-size: .85rem; display: none; margin-top: 1rem; }
    .alert.visible { display: block; }
    .alert.success { background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.3); color: var(--success); }
    .alert.error { background: rgba(139,26,26,.15); border: 1px solid rgba(139,26,26,.3); color: #e05555; }

    /* TAG MANAGER */
    .tag-manager-list { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
    .tag-manager-item { display: flex; align-items: center; gap: .4rem; background: var(--deep); border: 1px solid var(--border); border-radius: 20px; padding: .3rem .8rem; font-size: .8rem; }
    .tag-manager-item button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .8rem; padding: 0; }
    .tag-manager-item button:hover { color: #e05555; }

    /* GALLERY LIST */
    .gallery-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .gallery-item { background: var(--deep); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .gallery-item-image { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .gallery-item-info { padding: .8rem; }
    .gallery-item-title { font-size: .85rem; margin-bottom: .3rem; }
    .gallery-item-filename { font-size: .7rem; color: var(--muted); margin-bottom: .4rem; word-break: break-all; }
    .gallery-item-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .6rem; }
    .gallery-item-tags .tag { font-size: .65rem; background: rgba(139,26,26,.2); color: #e07070; border-radius: 10px; padding: .15rem .5rem; }
    .gallery-item-actions { display: flex; gap: .4rem; flex-wrap: wrap; }

    /* EDIT MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 1000; align-items: center; justify-content: center; padding: 2rem; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-card h3 { font-family: 'Cinzel', serif; font-size: .95rem; color: #c9a84c; margin-bottom: 1.2rem; }
    .modal-actions { display: flex; gap: .8rem; margin-top: 1.2rem; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-title">Micael Tatuagem</div>
    <div class="login-sub">Admin Galeria</div>
    <form id="loginForm">
      <div class="login-group">
        <label for="inputSenha">Senha</label>
        <input type="password" id="inputSenha" required autofocus />
      </div>
      <div class="login-group">
        <label for="inputToken">Token GitHub</label>
        <input type="password" id="inputToken" placeholder="ghp_..." required />
        <p class="login-hint">Necessário para upload de imagens.</p>
      </div>
      <button type="submit" class="btn-login">Acessar</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- PAINEL -->
<div id="adminPanel">
  <div class="admin-header">
    <h1>Admin · Galeria</h1>
    <div class="admin-header-links">
      <a href="galeria.html" target="_blank">👁 Ver galeria</a>
      <a href="admin-hub.html">⬅ Hub</a>
      <a onclick="logout()">🔐 Sair</a>
    </div>
  </div>

  <div class="github-status disconnected" id="githubStatus">
    <span id="githubStatusText">Verificando GitHub...</span>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-number" id="totalImages">0</div>
      <div class="stat-label">imagens</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" id="pendingSync">0</div>
      <div class="stat-label">sem URL</div>
    </div>
  </div>

  <!-- Adicionar imagem -->
  <div class="form-section">
    <h2>Adicionar Nova Imagem</h2>
    <div class="form-group">
      <label>Arquivo (WEBP, JPG, PNG)</label>
      <input type="file" id="imageFile" accept="image/*" />
    </div>
    <div class="preview-box">
      <img id="previewImage" alt="preview" />
      <span class="preview-placeholder" id="previewPlaceholder">Selecione uma imagem</span>
    </div>
    <div class="form-group" style="margin-top:1rem;">
      <label>Título *</label>
      <input type="text" id="imageTitle" placeholder="Ex: Dragão Blackwork" />
    </div>
    <div class="form-group">
      <label>Alt text (SEO)</label>
      <input type="text" id="imageAltText" placeholder="Descrição para buscadores" />
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea id="imageDescription" placeholder="Contexto, técnica, localização..."></textarea>
    </div>
    <div class="form-group">
      <label>Estilos</label>
      <div class="tags-container" id="tagsContainer"></div>
    </div>
    <div class="upload-progress" id="uploadProgress">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">Enviando...</div>
    </div>
    <button class="btn btn-primary" id="btnAdd" style="margin-top:1rem;" onclick="addImage()">Adicionar e Publicar</button>
    <div class="alert" id="mainAlert"></div>
  </div>

  <!-- Gerenciar tags -->
  <div class="form-section">
    <h2>Estilos / Tags</h2>
    <div style="display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;">
      <input type="text" id="newTagInput" placeholder="Nova tag..." style="flex:1;min-width:150px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--bone);padding:8px 12px;font-size:.85rem;outline:none;" />
      <button class="btn btn-secondary" onclick="addTag()">+ Adicionar</button>
    </div>
    <div class="tag-manager-list" id="tagManagerList"></div>
  </div>

  <!-- Galeria existente -->
  <div class="form-section">
    <h2>Imagens Publicadas</h2>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;">
      <button class="btn btn-secondary" onclick="exportData()">⬇ Backup JSON</button>
      <label class="btn btn-secondary" style="cursor:pointer;">⬆ Restaurar JSON<input type="file" id="importFile" accept=".json" style="display:none;" onchange="importData(event)" /></label>
    </div>
    <div class="gallery-list" id="galleryList"></div>
  </div>
</div>

<!-- Modal edição -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <h3>Editar Imagem</h3>
    <input type="hidden" id="editId" />
    <div class="form-group">
      <label>Título</label>
      <input type="text" id="editTitle" />
    </div>
    <div class="form-group">
      <label>Alt text</label>
      <input type="text" id="editAltText" />
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea id="editDescription"></textarea>
    </div>
    <div class="form-group">
      <label>Estilos</label>
      <div class="tags-container" id="editTagsContainer"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveEdit()">Salvar</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
  // ── CONFIG ──
  const STORAGE_KEY = 'micaelGallery_v2';
  const TAGS_KEY    = 'micaelTags';
  const AUTH_KEY    = 'micaelAdminAuth';
  const TOKEN_KEY   = 'ghToken';
  const REPO_OWNER  = 'micaeltatuagem';
  const REPO_NAME   = 'tatuagem';
  const BRANCH      = 'main';
  const IMAGE_FOLDER = 'galeria';
  const DATA_PATH   = `${IMAGE_FOLDER}/gallery-data.json`;
  const SITE_URL    = 'https://micaeltatuagem.github.io/tatuagem';
  const DEFAULT_TAGS = ['Dark Art', 'Blackwork', 'Colorido', 'Ornamental'];

  let GH_TOKEN = '';

  // ── AUTH ──
  document.addEventListener('DOMContentLoaded', () => {
    // Preview de arquivo
    document.getElementById('imageFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = document.getElementById('previewImage');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('previewPlaceholder').style.display = 'none';
      };
      reader.readAsDataURL(file);
    });

    // Fechar modal clicando fora
    document.getElementById('editModal').addEventListener('click', e => {
      if (e.target === document.getElementById('editModal')) closeEditModal();
    });

    // Login form
    document.getElementById('loginForm').addEventListener('submit', handleLogin);

    // Verifica sessão existente
    const auth  = sessionStorage.getItem(AUTH_KEY);
    const token = sessionStorage.getItem(TOKEN_KEY);
    if (auth && token) {
      GH_TOKEN = token;
      showPanel();
    }
  });

  async function handleLogin(e) {
    e.preventDefault();
    const senha  = document.getElementById('inputSenha').value;
    const token  = document.getElementById('inputToken').value.trim();
    const errEl  = document.getElementById('loginErr');

    if (senha !== 'Salmo31@$2') {
      errEl.textContent = '❌ Senha incorreta.';
      document.getElementById('inputSenha').value = '';
      return;
    }
    if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
      errEl.textContent = '❌ Token inválido.';
      return;
    }

    errEl.textContent = '⏳ Validando token...';
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, {
        headers: { Authorization: `token ${token}` }
      });
      if (!res.ok) throw new Error('Token sem acesso ao repositório.');
      GH_TOKEN = token;
      sessionStorage.setItem(AUTH_KEY, 'true');
      sessionStorage.setItem(TOKEN_KEY, token);
      errEl.textContent = '';
      showPanel();
    } catch (err) {
      errEl.textContent = '❌ ' + err.message;
    }
  }

  function logout() {
    if (confirm('Sair?')) { sessionStorage.clear(); location.reload(); }
  }

  async function showPanel() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    await seedGalleryFromRepo();
    await seedTagsFromRepo();
    renderTagManager();
    renderTags();
    renderGallery();
    updateStats();
    checkGitHubStatus();
  }

  // ── GITHUB STATUS ──
  async function checkGitHubStatus() {
    const el   = document.getElementById('githubStatus');
    const txt  = document.getElementById('githubStatusText');
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}`, {
        headers: { Authorization: `token ${GH_TOKEN}` }
      });
      if (res.ok) {
        el.className = 'github-status connected';
        txt.textContent = '✓ Conectado · micaeltatuagem/tatuagem';
      } else throw new Error();
    } catch {
      el.className = 'github-status disconnected';
      txt.textContent = '✗ Sem conexão com GitHub.';
    }
  }

  // ── STORAGE ──
  function getGallery() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  async function saveGallery(gallery) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gallery));
    await commitGalleryData(gallery);
  }

  function getTags() {
    try { return JSON.parse(localStorage.getItem(TAGS_KEY)) || DEFAULT_TAGS; }
    catch { return DEFAULT_TAGS; }
  }

  async function saveTags(tags) {
    localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
    await commitTags(tags);
  }

  // ── SEED FROM REPO ──
  async function seedGalleryFromRepo() {
    try {
      const res = await fetch(`${DATA_PATH}?t=${Date.now()}`, { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    } catch {}
  }

  async function seedTagsFromRepo() {
    try {
      const res = await fetch(`${IMAGE_FOLDER}/tags.json?t=${Date.now()}`, { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data)) localStorage.setItem(TAGS_KEY, JSON.stringify(data));
      }
    } catch {}
  }

  // ── RENDER ──
  function renderTags() {
    const tags = getTags();
    document.getElementById('tagsContainer').innerHTML = tags.map(s => `
      <div class="tag-option">
        <input type="checkbox" id="tag-${s}" value="${s}" />
        <label for="tag-${s}">${s}</label>
      </div>`).join('');
  }

  function renderTagManager() {
    const tags = getTags();
    const el = document.getElementById('tagManagerList');
    if (!tags.length) { el.innerHTML = '<p style="color:var(--muted);font-size:.85rem;">Nenhuma tag.</p>'; return; }
    el.innerHTML = tags.map(t => `
      <div class="tag-manager-item">
        <span>${t}</span>
        <button onclick="deleteTag('${t.replace(/'/g, "\\'")}')">✕</button>
      </div>`).join('');
  }

  function renderGallery() {
    const gallery   = getGallery();
    const container = document.getElementById('galleryList');
    if (!gallery.length) {
      container.innerHTML = '<p style="color:var(--muted);padding:1rem;">Nenhuma imagem ainda.</p>';
      return;
    }
    container.innerHTML = gallery.map(img => `
      <div class="gallery-item">
        <img src="${img.imageUrl || ''}" class="gallery-item-image" alt="${img.title}" loading="lazy" />
        <div class="gallery-item-info">
          <div class="gallery-item-title">${img.title}</div>
          <div class="gallery-item-filename">${img.filename || ''}</div>
          <div class="gallery-item-tags">${(img.styles||[]).map(s=>`<span class="tag">${s}</span>`).join('')}</div>
          <div class="gallery-item-actions">
            <button class="btn btn-secondary" style="padding:.3rem .7rem;font-size:.75rem;" onclick="openEditModal(${img.id})">Editar</button>
            <button class="btn btn-danger" style="padding:.3rem .7rem;font-size:.75rem;" onclick="deleteImage(${img.id})">Deletar</button>
          </div>
        </div>
      </div>`).join('');
  }

  function updateStats() {
    const g = getGallery();
    document.getElementById('totalImages').textContent = g.length;
    document.getElementById('pendingSync').textContent = g.filter(i => !i.imageUrl).length;
  }

  // ── TAGS CRUD ──
  async function addTag() {
    const input = document.getElementById('newTagInput');
    const val   = input.value.trim();
    if (!val) return;
    const tags = getTags();
    if (tags.includes(val)) { input.value = ''; return; }
    tags.push(val);
    await saveTags(tags);
    renderTagManager();
    renderTags();
    input.value = '';
  }

  async function deleteTag(tag) {
    if (!confirm(`Deletar tag "${tag}"?`)) return;
    const tags = getTags().filter(t => t !== tag);
    await saveTags(tags);
    renderTagManager();
    renderTags();
  }

  // ── UPLOAD ──
  async function uploadToGitHub(file, filename) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = async e => {
        const base64 = e.target.result.split(',')[1];
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMAGE_FOLDER}/${filename}`;
        let sha = null;
        try {
          const check = await fetch(url, { headers: { Authorization: `token ${GH_TOKEN}` } });
          if (check.ok) sha = (await check.json()).sha;
        } catch {}
        const body = { message: `Adiciona imagem: ${filename}`, content: base64, branch: BRANCH };
        if (sha) body.sha = sha;
        const res = await fetch(url, {
          method: 'PUT',
          headers: { Authorization: `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) { const err = await res.json(); reject(new Error(err.message || 'Erro no upload')); return; }
        resolve(`${IMAGE_FOLDER}/${filename}`);
      };
      reader.onerror = () => reject(new Error('Erro ao ler arquivo'));
      reader.readAsDataURL(file);
    });
  }

  // ── ADD IMAGE ──
  async function addImage() {
    const fileInput = document.getElementById('imageFile');
    const title     = document.getElementById('imageTitle').value.trim();
    const altText   = document.getElementById('imageAltText').value.trim();
    const desc      = document.getElementById('imageDescription').value;
    const styles    = Array.from(document.querySelectorAll('#tagsContainer input:checked')).map(cb => cb.value);
    const btnAdd    = document.getElementById('btnAdd');

    if (!fileInput.files[0] || !title) { showAlert('error', '❌ Título e imagem são obrigatórios.'); return; }
    if (!styles.length)                 { showAlert('error', '❌ Selecione pelo menos um estilo.'); return; }

    const file = fileInput.files[0];
    const ext  = file.name.split('.').pop().toLowerCase();
    const slug = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    const filename = `${Date.now()}-${slug}.${ext}`;

    btnAdd.disabled = true;
    setProgress(true, 'Enviando imagem...');

    try {
      setProgress(true, 'Enviando para GitHub...', 40);
      const imageUrl = await uploadToGitHub(file, filename);

      setProgress(true, 'Salvando metadados...', 80);
      const gallery = getGallery();
      const newId   = gallery.length ? Math.max(...gallery.map(i=>i.id)) + 1 : 1;
      gallery.unshift({ id: newId, filename, imageUrl, title, altText: altText || `${title} — tatuagem por Micael Faccio, Muriaé MG`, description: desc, styles, date: new Date().toISOString().split('T')[0] });
      await saveGallery(gallery);

      setProgress(true, 'Concluído!', 100);
      setTimeout(() => setProgress(false), 1500);
      renderGallery();
      updateStats();
      resetForm();
      showAlert('success', '✅ Imagem publicada com sucesso!');
    } catch (err) {
      setProgress(false);
      showAlert('error', '❌ Erro: ' + err.message);
    } finally {
      btnAdd.disabled = false;
    }
  }

  function setProgress(visible, text='', pct=0) {
    const el   = document.getElementById('uploadProgress');
    const fill = document.getElementById('progressFill');
    const txt  = document.getElementById('progressText');
    el.className = visible ? 'upload-progress visible' : 'upload-progress';
    if (fill) fill.style.width = pct + '%';
    if (txt)  txt.textContent  = text;
  }

  function resetForm() {
    document.getElementById('imageFile').value = '';
    document.getElementById('imageTitle').value = '';
    document.getElementById('imageAltText').value = '';
    document.getElementById('imageDescription').value = '';
    document.querySelectorAll('#tagsContainer input').forEach(cb => cb.checked = false);
    const img = document.getElementById('previewImage');
    img.style.display = 'none'; img.src = '';
    document.getElementById('previewPlaceholder').style.display = '';
  }

  // ── DELETE IMAGE ──
  async function deleteImage(id) {
    if (!confirm('Deletar esta imagem permanentemente?')) return;
    const gallery = getGallery();
    const img     = gallery.find(i => i.id === id);
    if (!img) return;

    if (img.filename) {
      try {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMAGE_FOLDER}/${img.filename}`;
        const check = await fetch(url, { headers: { Authorization: `token ${GH_TOKEN}` } });
        if (check.ok) {
          const { sha } = await check.json();
          await fetch(url, {
            method: 'DELETE',
            headers: { Authorization: `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `Remove imagem: ${img.filename}`, sha, branch: BRANCH })
          });
        }
      } catch {}
    }

    const filtered = gallery.filter(i => i.id !== id);
    await saveGallery(filtered);
    renderGallery();
    updateStats();
    showAlert('success', '✅ Imagem removida.');
  }

  // ── EDIT MODAL ──
  function openEditModal(id) {
    const img = getGallery().find(i => i.id === id);
    if (!img) return;
    document.getElementById('editId').value          = id;
    document.getElementById('editTitle').value       = img.title;
    document.getElementById('editAltText').value     = img.altText || '';
    document.getElementById('editDescription').value = img.description || '';
    const tags = getTags();
    document.getElementById('editTagsContainer').innerHTML = tags.map(s => `
      <div class="tag-option">
        <input type="checkbox" id="etag-${s}" value="${s}" ${(img.styles||[]).includes(s)?'checked':''} />
        <label for="etag-${s}">${s}</label>
      </div>`).join('');
    document.getElementById('editModal').classList.add('open');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
  }

  async function saveEdit() {
    const id     = parseInt(document.getElementById('editId').value);
    const title  = document.getElementById('editTitle').value.trim();
    const alt    = document.getElementById('editAltText').value.trim();
    const desc   = document.getElementById('editDescription').value;
    const styles = Array.from(document.querySelectorAll('#editTagsContainer input:checked')).map(cb=>cb.value);
    if (!title) { alert('Título obrigatório.'); return; }
    const gallery = getGallery().map(i => i.id===id ? {...i, title, altText:alt, description:desc, styles} : i);
    await saveGallery(gallery);
    renderGallery();
    closeEditModal();
    showAlert('success', '✅ Alterações salvas.');
  }

  // ── COMMIT ──
  async function commitGalleryData(gallery) {
    const exp     = gallery.map(({ image, ...rest }) => rest);
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(exp, null, 2))));
    const url     = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH}`;
    let sha = null;
    try { const r = await fetch(url,{headers:{Authorization:`token ${GH_TOKEN}`}}); if(r.ok) sha=(await r.json()).sha; } catch {}
    const body = { message: 'Atualiza gallery-data.json', content, branch: BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(url, { method:'PUT', headers:{Authorization:`token ${GH_TOKEN}`,'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (!res.ok) { const e=await res.json(); throw new Error(e.message||'Erro ao salvar dados'); }
  }

  async function commitTags(tags) {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(tags, null, 2))));
    const url     = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMAGE_FOLDER}/tags.json`;
    let sha = null;
    try { const r = await fetch(url,{headers:{Authorization:`token ${GH_TOKEN}`}}); if(r.ok) sha=(await r.json()).sha; } catch {}
    const body = { message: 'Atualiza tags.json', content, branch: BRANCH };
    if (sha) body.sha = sha;
    await fetch(url, { method:'PUT', headers:{Authorization:`token ${GH_TOKEN}`,'Content-Type':'application/json'}, body:JSON.stringify(body) });
  }

  // ── EXPORT / IMPORT ──
  function exportData() {
    const exp  = getGallery().map(({ image, ...rest }) => rest);
    const blob = new Blob([JSON.stringify(exp,null,2)],{type:'application/json'});
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `galeria-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error('Formato inválido');
        await saveGallery(data);
        renderGallery();
        updateStats();
        showAlert('success', '✅ Backup restaurado!');
      } catch (err) {
        showAlert('error', '❌ Erro: ' + err.message);
      }
      document.getElementById('importFile').value = '';
    };
    reader.readAsText(file);
  }

  // ── ALERT ──
  function showAlert(type, msg) {
    const el = document.getElementById('mainAlert');
    el.textContent = msg;
    el.className = `alert ${type} visible`;
    setTimeout(() => el.className = 'alert', 4000);
  }
</script>
</body>
</html>
