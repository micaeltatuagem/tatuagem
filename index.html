<!-- ── ESTILOS ── -->
<div class="estilos-wrap">
  <div class="estilos-inner">
    <p class="section-label fade-in">Linguagens</p>
    <div class="estilos-grid fade-in">

      <!-- Dark Art -->
      <div class="estilo-card">
        <svg class="motif" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="white" stroke-width="2"/>
          <path d="M50 10 L55 40 L85 40 L62 58 L70 88 L50 70 L30 88 L38 58 L15 40 L45 40 Z" stroke="white" stroke-width="1.5" fill="none"/>
        </svg>
        <div class="estilo-card-label">
          <strong>Dark Art</strong>
          <span>Mitologia · Ocultismo · Figura</span>
        </div>
      </div>

      <!-- Blackwork -->
      <div class="estilo-card">
        <svg class="motif" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="10" width="80" height="80" stroke="white" stroke-width="1.5"/>
          <rect x="20" y="20" width="60" height="60" stroke="white" stroke-width="1"/>
          <line x1="10" y1="10" x2="90" y2="90" stroke="white" stroke-width="1"/>
          <line x1="90" y1="10" x2="10" y2="90" stroke="white" stroke-width="1"/>
        </svg>
        <div class="estilo-card-label">
          <strong>Blackwork</strong>
          <span>Geométrico · Abstrato · Tribal</span>
        </div>
      </div>

      <!-- Colorido -->
      <div class="estilo-card">
        <svg class="motif" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="38" r="22" stroke="white" stroke-width="1.5"/>
          <path d="M30 62 Q50 80 70 62" stroke="white" stroke-width="1.5" fill="none"/>
          <line x1="38" y1="20" x2="34" y2="12" stroke="white" stroke-width="1"/>
          <line x1="50" y1="16" x2="50" y2="8"  stroke="white" stroke-width="1"/>
          <line x1="62" y1="20" x2="66" y2="12" stroke="white" stroke-width="1"/>
        </svg>
        <div class="estilo-card-label">
          <strong>Colorido</strong>
          <span>Neo-tradicional · Aquarela · Ilustrativo</span>
        </div>
      </div>

      <!-- Ornamental -->
      <div class="estilo-card">
        <svg class="motif" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="30" stroke="white" stroke-width="1.2"/>
          <circle cx="50" cy="50" r="20" stroke="white" stroke-width="1"/>
          <circle cx="50" cy="50" r="5" stroke="white" stroke-width="1.5"/>
          <line x1="50" y1="20" x2="50" y2="10" stroke="white" stroke-width="1"/>
          <line x1="50" y1="80" x2="50" y2="90" stroke="white" stroke-width="1"/>
          <line x1="20" y1="50" x2="10" y2="50" stroke="white" stroke-width="1"/>
          <line x1="80" y1="50" x2="90" y2="50" stroke="white" stroke-width="1"/>
        </svg>
        <div class="estilo-card-label">
          <strong>Ornamental Organica</strong>
          <span>Mandala · Filigrana · Simétrico</span>
        </div>
      </div>

    </div>
    <p style="font-size:0.9rem;margin-top:2rem;text-align:center;letter-spacing:0.1em;">
      <a href="galeria.html" style="color:var(--rust);text-decoration:none;transition:color 0.3s;font-weight:600;" onmouseover="this.style.color='var(--bone)'" onmouseout="this.style.color='var(--rust)'">
        Ver Galeria Completa →
      </a>
    </p>
  </div>
</div>
